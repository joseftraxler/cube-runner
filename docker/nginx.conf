# Konfigurace nginxu pro `docker-compose.yml` – servíruje kořen repozitáře.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Aby se manifest PWA neposílal jako obyčejný JSON. Prázdné `types` platí jen
    # uvnitř tohohle location – kdyby stálo v `server`, přebilo by mapu přípon
    # pro celý web a moduly by lezly jako application/octet-stream (a nenačetly by se).
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
    }

    # Service worker a HTML se nesmí cachovat v prohlížeči, jinak by se po úpravě
    # souborů hrála stará verze. Samotný sw.js je network-first, ale bez tohohle
    # by mu prohlížeč vracel svou uloženou kopii (viz kapitola PWA v CLAUDE.md).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Zbytek (moduly, styly, ikona) se revaliduje přes ETag – vývoj tak vidí
    # změny hned a nasazené soubory se stejně netahají znovu.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Do hry nepatří ani vývojové nástroje, ani historie gitu.
    location ~ ^/(\.git|tools)/ {
        return 404;
    }
}

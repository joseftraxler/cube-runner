# Spuštění hry v Dockeru: `docker compose up` a pak http://localhost:8080
# Python příkazy (generátor úrovní): `docker compose run --rm python …`
#
# Hra je statická (ES moduly, žádný build krok), takže stačí HTTP server –
# přes `file://` se moduly nenačtou. Zdrojáky jsou jen připojené do kontejneru,
# ne kopírované: změna souboru se projeví po obnovení stránky, bez přestavby.
services:
  game:
    image: nginx:alpine
    container_name: cube-runner
    ports:
      # Zvenku 8080, ať se to nepere s něčím na 80. Změň levé číslo, když chceš jinam.
      - "8080:80"
    volumes:
      # Jen pro čtení – kontejner do repozitáře nemá co psát.
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Kontejner na spouštění Python příkazů – hlavně generátoru úrovní:
  #   docker compose run --rm python                          # = --check (nic nezapíše)
  #   docker compose run --rm python tools/gen_levels.py      # přepíše js/levels/*.js
  #   docker compose run --rm python tools/gen_levels.py --verify js/levels/level3.js
  #   docker compose run --rm python -m http.server 8000      # server hry bez nginxu
  #
  # Generátor běží na čistém Pythonu 3 bez balíčků, takže stačí základní image
  # a není co instalovat. Nástroje v Node.js (playtest a spol.) sem nepatří –
  # potřebují Chromium přes playwright, což je jiná (a mnohem větší) krabice.
  python:
    image: python:3.12-alpine
    working_dir: /app
    # Profil drží kontejner mimo `docker compose up` – je to jednorázový příkaz,
    # ne služba. `docker compose run` si ho i tak spustí.
    profiles: ["tools"]
    # Zápisem, ne read-only: generátor přepisuje js/levels/*.js.
    volumes:
      - ./:/app
    environment:
      # Ať v repozitáři nezůstávají __pycache__ složky patřící rootovi.
      PYTHONDONTWRITEBYTECODE: "1"
      # Aby výstup lezl průběžně, a ne až po doběhnutí ověření.
      PYTHONUNBUFFERED: "1"
    # Bez tohohle by soubory přepsané generátorem patřily na hostiteli rootovi.
    # Spouštěj jako `UID=$(id -u) GID=$(id -g) docker compose run --rm python …`
    # (v shellu to nejsou proměnné prostředí, takže se musí předat ručně).
    user: "${UID:-0}:${GID:-0}"
    entrypoint: ["python3"]
    command: ["tools/gen_levels.py", "--check"]
